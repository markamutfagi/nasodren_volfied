name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GOAL-045: yuksek skorlar + cok oyunculu artik Supabase uzerinden.
      # Settings → Secrets and variables → Actions → Variables'a ekle:
      #   VITE_SUPABASE_URL      (orn. https://xxxx.supabase.co)
      #   VITE_SUPABASE_ANON_KEY (Supabase proje ayarlarindaki "anon public" anahtar)
      # Bos kalirsa yuksek skorlar yerel (localStorage) kalir ve menude
      # BIRLIKTE OYNA gorunmez — sayfa yine de calisir, cokmez.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
